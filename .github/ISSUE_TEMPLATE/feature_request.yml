name: Feature Request
description: Suggest an idea or enhancement for SaaSWorkspace
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement! Please describe your proposed capability in detail.
  - type: input
    id: feature-title
    attributes:
      label: Feature Title
      description: A concise summary of the proposed enhancement.
      placeholder: e.g., Support custom organization roles beyond Admin and Member
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific problem or architectural requirement?
      placeholder: e.g., I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Architecture
      description: A clear and concise description of what you want to happen and how it fits into the serverless architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A description of any alternative solutions or workarounds you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, diagrams, or references here.
